[package]
name = "cross-venue-margin"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa"] }
prometheus-client = "0.26.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmp-serde = "1.3.1"
rust_decimal = { version = "1.43.0", features = ["macros", "serde-with-str"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bench]]
name = "engine"
harness = false
