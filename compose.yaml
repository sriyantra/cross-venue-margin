services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: margin
    volumes:
      - events:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  margin:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:margin@postgres:5432/postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  events:
